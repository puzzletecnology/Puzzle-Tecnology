<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PuzzleOS | El Futuro es Modular</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #030305;
            --fg: #f5f7fb;
            --accent: #7c9cff;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background-color: var(--bg); color: var(--fg);
            overflow-x: hidden; scroll-behavior: smooth;
        }

        #universe-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.6; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
        .logo { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: 3px; }
        .puzzle-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; box-shadow: 0 0 20px var(--accent); }

        .manifesto-box {
            margin: 40px 0 60px 0;
            padding: 30px;
            background: linear-gradient(90deg, rgba(124, 156, 255, 0.05) 0%, transparent 100%);
            border-left: 4px solid var(--accent);
            border-radius: 0 24px 24px 0;
            backdrop-filter: blur(10px);
        }

        .glitch-text {
            font-weight: 800; font-size: 12px; letter-spacing: 4px;
            color: var(--accent); text-transform: uppercase; display: block; margin-bottom: 15px;
        }

        .manifesto-box p {
            font-size: clamp(16px, 2vw, 22px);
            line-height: 1.6; color: #cbd5e1;
            max-width: 900px; margin: 0;
        }

        /* AJUSTE PARA MÓVIL: De 2 columnas a 1 */
        .hero { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 40px; 
            align-items: center; 
            min-height: 80vh; 
        }

        @media (max-width: 768px) {
            .hero { grid-template-columns: 1fr; text-align: center; }
            .manifesto-box { padding: 20px; border-radius: 20px; }
        }

        .visualizer {
            position: relative;
            background: radial-gradient(circle at center, rgba(124, 156, 255, 0.1) 0%, transparent 70%);
            text-align: center;
        }

        .main-device {
            width: 100%; 
            max-width: 450px;
            height: auto;
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.8));
        }

        .interface-panel {
            background: var(--glass); border: 1px solid var(--border);
            backdrop-filter: blur(20px); border-radius: 30px;
            padding: 20px; margin-top: 20px;
        }

        .module-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }

        .mod-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 15px 5px; border-radius: 15px; cursor: pointer; text-align: center;
        }

        .mod-card h4 { font-size: 12px; margin: 5px 0 0 0; }
        .mod-card:hover { border-color: var(--accent); background: rgba(124, 156, 255, 0.05); }

        #kernel-console {
            margin-top: 20px; font-family: monospace; font-size: 11px;
            color: var(--accent); border-top: 1px solid var(--border); padding-top: 15px;
            text-align: left;
        }

        .floating { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .flash { animation: flash-anim 0.5s ease; }
        @keyframes flash-anim { 0% { filter: brightness(3); } 100% { filter: brightness(1); } }

    </style>
</head>
<body>

    <canvas id="universe-canvas"></canvas>

    <div class="container">
        <nav>
            <div class="logo"><div class="puzzle-icon"></div> PUZZLE TECHNOLOGY</div>
            <div style="font-size: 10px; opacity: 0.6;">v1.0</div>
        </nav>

        <section class="manifesto-box">
            <div class="manifesto-content">
                <span class="glitch-text">La Esencia</span>
                <p>PuzzleOS no es un producto terminado, es un ecosistema vivo. Es la transición a la <strong>tecnología de creación</strong>.</p>
            </div>
        </section>

        <section class="hero">
            <div class="hero-text">
                <h1>Diseña tu <span style="color: var(--accent)">Universo.</span></h1>
                <div class="interface-panel">
                    <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent);">Simulador</div>
                    <div class="module-cards">
                        <div class="mod-card" onclick="install('foto1.png', 'CORE_UNIT', '#7c9cff', 'Kernel optimizado.')">
                            <i class="fas fa-microchip"></i>
                            <h4>Core</h4>
                        </div>
                        <div class="mod-card" onclick="install('foto2.png', 'OPTICS_MOD', '#ff4757', 'Cámara detectada.')">
                            <i class="fas fa-camera"></i>
                            <h4>Cámara</h4>
                        </div>
                        <div class="mod-card" onclick="install('foto3.jpg', 'HARDWARE_GRID', '#a55eea', 'Slots activos.')">
                            <i class="fas fa-th"></i>
                            <h4>Slots</h4>
                        </div>
                    </div>
                    <div id="kernel-console">> Sistema listo...</div>
                </div>
            </div>

            <div class="visualizer">
                <img src="foto1.png" id="device-img" class="main-device floating" alt="Puzzle Prototipo">
            </div>
        </section>
    </div>

    <script>
        const canvas = document.getElementById('universe-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let speed = 0.4;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.z = Math.random()*2; }
            update() { this.y -= this.z * speed; if(this.y<0) this.y = canvas.height; }
            draw() { ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(this.x, this.y, this.z, 0, Math.PI*2); ctx.fill(); }
        }
        for(let i=0; i<100; i++) stars.push(new Star());

        function loop() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            stars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(loop);
        }
        loop();

        function install(url, name, color, logText) {
            const device = document.getElementById('device-img');
            const console = document.getElementById('kernel-console');
            device.classList.remove('flash');
            void device.offsetWidth; 
            device.classList.add('flash');
            setTimeout(() => {
                device.src = url;
                document.documentElement.style.setProperty('--accent', color);
                console.innerHTML = `> MÓDULO: ${name}<br>> ${logText}`;
            }, 100);
        }
    </script>
</body>
</html>
