<script>
    const canvas = document.getElementById('universe-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let speed = 0.4;

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    class Star {
        constructor() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.z = Math.random()*2; }
        update() { this.y -= this.z * speed; if(this.y<0) this.y = canvas.height; }
        draw() { ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(this.x, this.y, this.z, 0, Math.PI*2); ctx.fill(); }
    }
    for(let i=0; i<100; i++) stars.push(new Star());

    function loop() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        stars.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(loop);
    }
    loop();

    // NUEVA LÓGICA DE MÓDULOS
    const MODULOS = {
        CORE: { url: 'foto1.png', name: 'CORE_UNIT_V1', color: '#7c9cff', log: 'Kernel optimizado para 18 slots magnéticos.' },
        CAMERA: { url: 'foto2.png', name: 'OPTICS_MOD_X', color: '#ff4757', log: 'Cámara desmontable detectada. Calibrando sensores...' },
        SLOTS: { url: 'foto3.jpg', name: 'HARDWARE_GRID', color: '#a55eea', log: 'Matriz completa activa. Bus de datos al 100%.' }
    };

    let typingTimer;
    function typeConsole(text) {
        const consoleElem = document.getElementById('kernel-console');
        consoleElem.innerHTML = "> ";
        let i = 0;
        clearTimeout(typingTimer);
        
        function type() {
            if (i < text.length) {
                consoleElem.innerHTML += text.charAt(i);
                i++;
                typingTimer = setTimeout(type, 30);
            }
        }
        type();
    }

    function install(modKey) {
        const mod = MODULOS[modKey];
        const device = document.getElementById('device-img');
        
        // Efecto visual de carga
        device.style.filter = "brightness(3) blur(10px)";
        
        setTimeout(() => {
            device.src = mod.url;
            document.documentElement.style.setProperty('--accent', mod.color);
            device.style.filter = "brightness(1) blur(0px)";
            
            const logFull = `MÓDULO_SINCRO: ${mod.name} | ${mod.log}`;
            typeConsole(logFull);
            
            speed = modKey === 'SLOTS' ? 5 : 0.4;
        }, 200);
    }
</script>
